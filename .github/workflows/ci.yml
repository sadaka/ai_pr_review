name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.5"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      # Definition-of-Done gate: mypy clean AND pytest green.
      - name: mypy
        run: uv run mypy .

      # Live-credential tests skipif on TIGER_DATABASE_URL / OPENAI_API_KEY,
      # so this stays green without secrets.
      - name: pytest
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.5"
      # Proves the wheel packages every runtime module (regression guard for the
      # pyproject wheel-packages list).
      - name: Build wheel
        run: uv build --wheel
      - name: Docker build
        run: docker build -t ai-pr-review-backend:ci .
